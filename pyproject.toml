[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-rr"
version = "0.1.0"
description = "Flight recorder, time-travel debugger, and git bisect engine for coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "starlette>=0.38.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0"]

[project.scripts]
agent-rr = "agent_rr.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_rr"]

[dependency-groups]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
